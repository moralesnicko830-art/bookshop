<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Books</title>
  <meta name="description" content="An independent bookshop. Browse classics, fantasy, science fiction, mystery, literary fiction and nonfiction.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#top" aria-label="Lantern Books, home">Lantern Books</a>
    <label class="search">
      <span class="sr">Search by title or author</span>
      <input id="q" type="search" placeholder="Search by title or author" autocomplete="off">
    </label>
    <button id="cartBtn" class="cart-btn" aria-haspopup="dialog">
      Cart <span id="cartCount" class="count">0</span>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Find your next read.</h1>
      <p>Eighteen books we’d hand to a friend. Pick a spine, or search the shelves below.</p>
      <div id="spines" class="spines" role="list" aria-label="Featured books"></div>
    </section>

    <section class="browse" aria-labelledby="shelfHeading">
      <h2 id="shelfHeading" class="sr">Browse books</h2>
      <div class="controls">
        <div id="genres" class="genres" role="group" aria-label="Filter by genre"></div>
        <label class="sort">
          Sort by
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="title">Title, A to Z</option>
            <option value="low">Price, low to high</option>
            <option value="high">Price, high to low</option>
          </select>
        </label>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="shelf" class="shelf"></div>
    </section>
  </main>

  <footer class="foot">
    <p>Lantern Books is a demo store. Prices and stock are placeholders.</p>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="dTitle"></dialog>

  <aside id="drawer" class="drawer" aria-label="Shopping cart" hidden>
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button id="closeCart" class="plain" aria-label="Close cart">Close</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-foot">
      <p class="total"><span>Total</span> <strong id="cartTotal">$0.00</strong></p>
      <button id="checkout" class="primary">Place demo order</button>
      <p id="orderMsg" class="order-msg" aria-live="polite"></p>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
